---
features:
  - |
    Added ``openstack.key_manager.v1.secret.Secret.migrate_store`` and
    ``Proxy.migrate_secret_store`` to migrate an existing Barbican
    secret onto another secret store via path-based
    ``PUT /v1/secrets/{id}/secret-store/{secret-store-id}`` (key-manager
    microversion 1.3). The destination is a single required
    ``secret_store`` argument (UUID, URI, or ``SecretStore`` instance).
    Secret resources also expose computed ``secret_store_id`` and
    ``secret_store_ref`` from GET/list (may be null).
fixes:
  - |
    Fixed key-manager microversion negotiation against Barbican.
    Barbican's unversioned discovery document never carries a
    microversion range (by design, for backward compatibility with
    pre-microversion clients), so ``openstack.utils.supports_microversion()``
    / ``maximum_supported_microversion()`` could never detect support.
    ``Secret`` and ``SecretStore`` now negotiate via
    ``openstack.key_manager.v1._microversion``, which probes discovery
    with an explicit ``OpenStack-API-Version`` header (the same
    workaround already used by python-barbicanclient).
