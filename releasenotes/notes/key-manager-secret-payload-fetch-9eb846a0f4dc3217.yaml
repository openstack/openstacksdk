---
features:
  - |
    Add a keyword-only ``get_payload`` parameter to ``key_manager.get_secret``
    and ``key_manager.find_secret``. It defaults to ``True`` for ``get_secret``
    and ``False`` for ``find_secret``. Set it to ``False`` to retrieve metadata
    without requesting the payload. Add ``key_manager.fetch_secret_payload``
    to populate the payload on an existing secret, including a secret returned
    by ``key_manager.secrets``, without fetching its metadata again. When
    passing a secret ID instead of a resource, the keyword-only ``content_type``
    parameter is required. It may also be used to override a resource's
    payload content type.
upgrade:
  - |
    ``openstack.key_manager.v1.secret.Secret.fetch`` now retrieves only the
    main resource, without fetching its payload. Use ``Secret.fetch_payload``
    to populate the payload separately. The proxy's ``get_secret`` method
    continues to retrieve both metadata and payload.
